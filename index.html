<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f15" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="1ZR Lab" />
  <title>Toyota Engine Lab · 1ZR-FE</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">1ZR</span>
        <div class="brand-text"><b>Toyota Engine Lab</b><small>Corolla E150 · 1ZR-FE 1.6 Dual VVT-i</small></div>
      </div>
      <div class="task-chip" id="taskChip">Свободный режим</div>
      <div class="build">сборка %BUILD%</div>
    </header>

    <aside class="side left" id="leftPanel">
      <div class="panel-title">Узлы и детали</div>
      <div id="treeHost" class="scroll"></div>
    </aside>

    <main class="center">
      <div class="viewport" id="viewport">
        <div class="vtoolbar" id="vtoolbar"></div>
        <div class="hint-overlay" id="hintOverlay">Тяните — вращать · щипок/колесо — приблизить · нажмите на деталь</div>
      </div>
      <section class="dash">
        <canvas id="cluster" class="cluster"></canvas>
        <div class="controls" id="controls"></div>
      </section>
    </main>

    <aside class="side right" id="rightPanel">
      <nav class="tabs" id="tabs"></nav>
      <div id="tabHost" class="scroll"></div>
    </aside>
  </div>
  <div id="modalHost"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
